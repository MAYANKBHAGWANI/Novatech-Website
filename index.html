<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Basic SEO (page-specific titles/descriptions are set in React by the Seo component) -->
    <title>NovaTech Solutions | Modern Web Development Agency</title>
    <meta
      name="description"
      content="NovaTech Solutions creates modern, fast and responsive websites and apps for growing businesses."
    />

    <!-- Open Graph tags (used when the link is shared on social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NovaTech Solutions | Modern Web Development Agency" />
    <meta
      property="og:description"
      content="Modern, fast and responsive digital experiences for growing businesses."
    />

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data (JSON-LD) describing the business for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NovaTech Solutions",
        "description": "A modern digital and web development agency.",
        "email": "hello@novatech.example",
        "telephone": "+1-555-123-4567"
      }
    </script>

    <!-- Apply saved theme before React loads so the page doesn't flash the wrong colours -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
